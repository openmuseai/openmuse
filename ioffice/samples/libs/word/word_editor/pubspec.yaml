name: word_editor
description: Word-like editor shell on top of word_render (ribbon, pages, selection).
# 供其他工程开箱引入：git 依赖不受 publish_to 影响；
# 要发布到 pub 仓库（pub.dev 或私有 server）时，删除本行（默认即 pub.dev）。
version: 0.4.18

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  # 发布形态：版本约束（由 git / 私有 pub server 解析）。
  # 本地开发用 ../word_render：见同目录 pubspec_overrides.yaml（发布时被 pub 忽略）。
  word_render: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
