uuid = { version = "1", features = ["v4"] }
# 前置 ⑦（s01-10）：canonical JSON 序列化。**仅工装面**（`opc/Dump.rs` + `bin/s01_package_dump.rs`）
# 使用，产品链（`api/DocumentOpen.rs`）不引用 —— 见 57_function_parity_rust_dump/FUNCTION.md §1.5。
serde_json = "1"

[dev-dependencies]
# Rust-only: 用例用第三方 `zip` crate **造夹具**（写 zip 字节）。生产路径（src/）只经 kfs，
# 见 16_function_zip_open/FUNCTION.md §1.7「不再有第二套解析器」。
zip = { version = "2", default-features = false, features = ["deflate"] }


