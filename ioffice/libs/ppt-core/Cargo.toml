[package]
name = "ppt-core"
version = "0.1.0"
edition = "2021"
description = """
Cross-platform presentation engine: parse, layout, cache, and render-command generation.

Rust port of koffice/presentation/core — designed to produce output identical to the
original Java implementation while enabling three-platform unification
(Web, Desktop, Mobile) via the ioffice Flutter+Rust architecture.
"""

[features]
default = []
uniffi = ["dep:uniffi"]
full = ["dep:picparser"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uniffi = { version = "0.28", optional = true }

# Workspace internal crates (aliased to match generated import paths)
util = { package = "core_libs_util", path = "../core-libs/util/util" }
util_adapter = { path = "../core-libs/util/adapter" }
drawing = { package = "core_libs_drawing", path = "../core-libs/drawing" }
kfc = { package = "core_libs_kfc_main", path = "../core-libs/kfc/kfc" }
kfc_kfc_alpha = { package = "core_libs_kfc", path = "../core-libs/kfc/kfc_alpha" }
kfs_kfs_app = { package = "core_libs_kfs_app", path = "../core-libs/kfs/kfs_app" }
thirdparty_jaxen = { package = "core_libs_jaxen", path = "../core-libs/thirdparty/jaxen" }
io_wps_io = { package = "core_libs_io", path = "../core-libs/io/wps-io" }
io_poi_compact = { package = "core_libs_poi_compact", path = "../core-libs/io/poi-compact" }
picparser = { package = "core_libs_picparser", path = "../core-libs/thirdparty/picparser", optional = true }
wpslayout = { package = "core_libs_wpslayout", path = "../core-libs/wpslayout" }
core_libs_font = { path = "../core-libs/thirdparty/font" }
stubs = { path = "../core-libs/stubs" }
thirdparty_kInk = { package = "core_libs_kink", path = "../core-libs/thirdparty/kInk" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
zip = { version = "2", features = ["lzma", "zstd", "bzip2"] }

[dev-dependencies]
pretty_assertions = "1"
drawing = { package = "core_libs_drawing", path = "../core-libs/drawing" }

