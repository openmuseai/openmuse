[package]
name = "ss-core"
version = "0.1.0"
edition = "2021"
description = """
Cross-platform spreadsheet engine: parse, calculate, layout, and render-command generation.

Rust port of koffice/et/core — designed to produce output identical to the
original Java implementation while enabling three-platform unification
(Web, Desktop, Mobile) via the ioffice Flutter+Rust architecture.
"""

[lib]
name = "ss_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
uniffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uniffi = { version = "0.28", optional = true }
util = { package = "core_libs_util", path = "../core-libs/util/util" }
kfc = { package = "core_libs_kfc_main", path = "../core-libs/kfc/kfc" }
kfc_kfc_alpha = { package = "core_libs_kfc", path = "../core-libs/kfc/kfc_alpha" }
kfs_kfs_app = { package = "core_libs_kfs_app", path = "../core-libs/kfs/kfs_app" }
util_adapter = { path = "../core-libs/util/adapter" }
io_poi_compact = { package = "core_libs_poi_compact", path = "../core-libs/io/poi-compact" }
regex = "1"
chrono = "0.4.44"
libm = "=0.2.16"
num-bigint = "0.4.6"
num-traits = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
zip = { version = "2", features = ["lzma", "zstd", "bzip2"] }
memmap2 = "0.9.10"

[dev-dependencies]
pretty_assertions = "1"
sha2 = "0.10.9"

