[package]
name = "word-core"
version = "0.1.1"
edition = "2021"
description = """
Cross-platform Word document engine: parse, layout, and render-command generation.
Rust port of koffice/writer/core — designed to produce output identical to the
original Java implementation while enabling three-platform unification
(Web, Desktop, Mobile) via the ioffice-word Flutter+Rust architecture.
"""

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "docx_mvp_render"
path = "src/bin/docx_mvp_render.rs"

[features]
default = []
# Enable UniFFI bindings for Kotlin/Swift (Android/iOS bridge)
uniffi = ["dep:uniffi"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ropey = "1"
chrono = "0.4"
uniffi = { version = "0.28", optional = true }
regex = "1.12.3"
ttf-parser = "0.24"

# Workspace internal crates — dependency keys match generated `use <key>::…` paths
util = { package = "core_libs_util", path = "../core-libs/util/util" }
util_adapter = { path = "../core-libs/util/adapter" }
drawing = { package = "core_libs_drawing", path = "../core-libs/drawing" }
kfc = { package = "core_libs_kfc_main", path = "../core-libs/kfc/kfc" }
kfc_kfc_alpha = { package = "core_libs_kfc", path = "../core-libs/kfc/kfc_alpha" }
kfs_kfs_app = { package = "core_libs_kfs_app", path = "../core-libs/kfs/kfs_app" }
io_wps_io = { package = "core_libs_io", path = "../core-libs/io/wps-io" }
io_poi_compact = { package = "core_libs_poi_compact", path = "../core-libs/io/poi-compact" }
io_uof_io = { package = "core_libs_uof_io", path = "../core-libs/io/uof-io" }
io_css_io = { package = "css-io", path = "../core-libs/io/css-io" }
core_libs_libfileformat = { path = "../core-libs/io/libfileformat" }
thirdparty_dom4j = { package = "core_libs_dom4j", path = "../core-libs/thirdparty/dom4j" }
thirdparty_font = { package = "core_libs_font", path = "../core-libs/thirdparty/font" }
thirdparty_kInk = { package = "core_libs_kink", path = "../core-libs/thirdparty/kInk" }
thirdparty_juniversalchardet = { package = "core_libs_juniversalchardet", path = "../core-libs/thirdparty/juniversalchardet" }
stubs = { path = "../core-libs/stubs" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21" 

[target.'cfg(all(not(target_family = "wasm"), not(target_os = "android")))'.dependencies]
zip = { version = "2", features = ["lzma", "zstd", "bzip2"] }

# uuid 1.x v4 needs a JS entropy source on wasm32-unknown-unknown.
[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { version = "1", features = ["v4", "serde", "js"] }

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

