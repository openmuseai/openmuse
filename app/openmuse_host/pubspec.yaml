name: openmuse_host
description: OpenMuse desktop host shell.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  openmuse_auth_gotrue:
    path: ../../plugins/auth-gotrue
  openmuse_cloud_workspace_plugin:
    path: ../../plugins/cloud-workspace
  openmuse_builtin_plugins:
    path: ../../distribution/openmuse_builtin_plugins
  muse_remote_surface_core:
    path: ../../packages/muse_remote_surface_core
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk
  openmuse_host_shell:
    path: ../../packages/openmuse_host_shell
  openmuse_workbench_layout:
    path: ../../packages/openmuse_workbench_layout
  openmuse_dsh_plugin:
    path: ../../plugins/dsh-agent
  openmuse_workspace_paired:
    path: ../../plugins/workspace-paired
  path: ^1.9.1
  path_provider: ^2.1.5
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  openmuse_helix_plugin:
    path: ../../plugins/helix

flutter:
  uses-material-design: true
