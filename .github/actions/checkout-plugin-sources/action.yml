name: Checkout fixed plugin sources
description: Compose the exact private Ecosystem sources beside the Client checkout.
inputs:
  token:
    description: Contents-read token scoped to the Ecosystem and its 15 plugin repositories.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Read the pinned source identity
      id: pin
      shell: bash
      env:
        SOURCE_TOKEN: ${{ inputs.token }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        if not os.environ.get('SOURCE_TOKEN'):
            raise SystemExit('MUSE_PLUGIN_READ_TOKEN is required with Contents:read access to the Ecosystem and its 15 private plugin repositories.')
        pin = json.loads(Path('config/release/mobile-1.0.3-sources.json').read_text())['ecosystem']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('repository=' + pin['repository'] + '\n')
            out.write('commit=' + pin['commit'] + '\n')
        PY
    - name: Checkout immutable Ecosystem and gitlinks
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.pin.outputs.repository }}
        ref: ${{ steps.pin.outputs.commit }}
        token: ${{ inputs.token }}
        path: .muse-ci-plugin-sources
        submodules: recursive
        persist-credentials: false
    - name: Verify and place the sibling composition
      shell: bash
      run: |
        python3 scripts/ci/verify_plugin_sources.py --ecosystem .muse-ci-plugin-sources
        python3 - <<'PY'
        import os
        from pathlib import Path
        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        destination = workspace.parent / 'Muse-Plugin-Ecosystem'
        if destination.exists() or destination.is_symlink():
            raise SystemExit('Refusing to replace an existing sibling source directory')
        (workspace / '.muse-ci-plugin-sources').rename(destination)
        PY
