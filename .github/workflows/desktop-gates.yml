name: desktop-gates

on:
  push:
  pull_request:

jobs:
  # Same script as .github/workflows/macos-build.yml, so the gate and the
  # releasable package can never diverge.
  macos:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      FLUTTER_VERSION: "3.44.2"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: third_party/dsh/package-lock.json
      - name: Bootstrap
        run: ./scripts/ci/bootstrap-macos.sh --expected-flutter-version "${{ env.FLUTTER_VERSION }}"
      - name: Build, test and package
        run: ./scripts/ci/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-macos-unsigned
          path: |
            dist/OpenMuse-macos.zip
            dist/SHA256SUMS.txt
            dist/build-info.txt
          if-no-files-found: error

  # Same script as .github/workflows/windows-build.yml, so the gate and the
  # releasable package can never diverge.
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: "3.44.2"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap
        shell: pwsh
        run: pwsh scripts/ci/bootstrap-windows.ps1 -ExpectedFlutterVersion '${{ env.FLUTTER_VERSION }}'
      - name: Build, test and package
        shell: pwsh
        run: pwsh scripts/ci/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-windows-unsigned
          path: |
            dist/OpenMuse-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/build-info.txt
          if-no-files-found: error
