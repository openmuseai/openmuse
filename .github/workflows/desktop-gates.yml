name: desktop-gates

defaults:
  run:
    working-directory: Muse-Client

on:
  # Dispatchable so a release can start the desktop gate on demand; the
  # releasable packages are windows-build.yml and macos-build.yml.
  workflow_dispatch:
  push:
  pull_request:

jobs:
  # Same script as .github/workflows/macos-build.yml, so the gate and the
  # releasable package can never diverge.
  macos:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      FLUTTER_VERSION: "3.44.2"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Enable long Windows source paths
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: Muse-Client
      - name: Compose pinned plugin sources
        uses: ./Muse-Client/.github/actions/checkout-plugin-sources
        with:
          token: ${{ secrets.MUSE_PLUGIN_READ_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: Muse-Client/third_party/dsh/package-lock.json
      - name: Bootstrap
        run: ./scripts/ci/bootstrap-macos.sh --expected-flutter-version "${{ env.FLUTTER_VERSION }}"
      - name: Build, test and package
        run: ./scripts/ci/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-macos-unsigned
          path: |
            Muse-Client/dist/OpenMuse-macos.zip
            Muse-Client/dist/SHA256SUMS.txt
            Muse-Client/dist/build-info.txt
          if-no-files-found: error

  # Same script as .github/workflows/windows-build.yml, so the gate and the
  # releasable package can never diverge.
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: "3.44.2"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      HELIX_DISABLE_AUTO_GRAMMAR_BUILD: "1"
    steps:
      - name: Enable long Windows source paths
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: Muse-Client
      - name: Compose pinned plugin sources
        uses: ./Muse-Client/.github/actions/checkout-plugin-sources
        with:
          token: ${{ secrets.MUSE_PLUGIN_READ_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: Muse-Client/third_party/dsh/package-lock.json
      - name: Restore Helix cargo cache
        uses: actions/cache@v4
        with:
          path: Muse-Client/third_party/helix/target
          key: win-helix-${{ hashFiles('Muse-Client/third_party/helix/Cargo.lock') }}
      - name: Bootstrap
        shell: pwsh
        run: pwsh scripts/ci/bootstrap-windows.ps1 -ExpectedFlutterVersion '${{ env.FLUTTER_VERSION }}'
      - name: Build, test and package
        shell: pwsh
        run: pwsh scripts/ci/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-windows-unsigned
          path: |
            Muse-Client/dist/OpenMuse-windows-x64.zip
            Muse-Client/dist/SHA256SUMS.txt
            Muse-Client/dist/build-info.txt
          if-no-files-found: error
