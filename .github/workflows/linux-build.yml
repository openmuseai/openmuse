name: Linux build
defaults:
  run:
    working-directory: Muse-Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/openmuse_linux/**'
      - 'packages/**'
      - 'plugins/**'
      - 'distribution/**'
      - 'third_party/**'
      - 'scripts/build_dsh_closure.py'
      - '.github/workflows/linux-build.yml'
      - '.github/actions/prepare-plugin-assets/**'
      - 'scripts/ci/prepare_plugin_assets.py'
  pull_request:
    paths:
      - 'app/openmuse_linux/**'
      - 'packages/**'
      - 'plugins/**'
      - 'distribution/**'
      - 'third_party/**'
      - '.github/workflows/linux-build.yml'
      - '.github/actions/prepare-plugin-assets/**'
      - 'scripts/ci/prepare_plugin_assets.py'
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            region: cn
          - runner: ubuntu-24.04
            arch: amd64
            region: us
          - runner: ubuntu-24.04-arm
            arch: arm64
            region: cn
          - runner: ubuntu-24.04-arm
            arch: arm64
            region: us
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: Muse-Client
      - name: Compose pinned plugin sources
        uses: ./Muse-Client/.github/actions/checkout-plugin-sources
        with:
          token: ${{ secrets.MUSE_PLUGIN_READ_TOKEN }}
      - name: Prepare Debian 12 builder
        run: docker build --build-arg DEBIAN_MIRROR=http://deb.debian.org/debian -f app/openmuse_linux/tool/Dockerfile -t openmuse-linux-builder .
      - name: Generate pinned browser cores and runtime
        uses: ./Muse-Client/.github/actions/prepare-plugin-assets
        with:
          runtime: 'true'
      - name: Build, test and package
        run: |
          docker run --rm --shm-size=1g --workdir /Muse-Client \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/Muse-Client \
            -v "$PWD:/Muse-Client" \
            -v "$PWD/../Muse-Plugin-Ecosystem:/Muse-Plugin-Ecosystem" \
            -v openmuse-linux-pub:/root/.pub-cache \
            -v openmuse-linux-cargo-registry:/root/.cargo/registry \
            -v openmuse-linux-cargo-git:/root/.cargo/git \
            openmuse-linux-builder bash app/openmuse_linux/tool/build.sh --region "${{ matrix.region }}"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-linux-${{ matrix.arch }}-${{ matrix.region }}-${{ github.sha }}
          path: Muse-Client/app/openmuse_linux/build/dist/${{ matrix.arch }}/${{ matrix.region }}/
          if-no-files-found: error
          retention-days: 14
