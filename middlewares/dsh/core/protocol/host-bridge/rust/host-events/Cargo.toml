[package]
name = "muse-host-events"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bounded domain-neutral event retention and fan-out for Muse Host"
publish = false

[dependencies]
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.49.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
