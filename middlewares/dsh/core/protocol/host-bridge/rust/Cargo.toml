[package]
name = "muse-host-bridge-contract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Minimal Rust projection of the domain-neutral Muse Host Bridge v1 contract"

[workspace]
members = [".", "host-context", "host-events", "host-registry", "host-transport", "host-policy", "host-runtime"]
resolver = "3"

[dependencies]
hex = "0.4.3"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
