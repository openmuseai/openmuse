[package]
name = "muse-host-registry"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Domain-neutral Host capability registration, discovery, binding and revocation"
publish = false

[dependencies]
async-trait = "0.1.89"
muse-host-bridge-contract = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.49.0", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
