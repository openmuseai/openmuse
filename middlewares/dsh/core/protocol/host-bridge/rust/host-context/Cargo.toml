[package]
name = "muse-host-context"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Domain-neutral surface context coordination store for Muse Host"
publish = false

[dependencies]
muse-host-events = { path = "../host-events" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.18.1", features = ["v4"] }
