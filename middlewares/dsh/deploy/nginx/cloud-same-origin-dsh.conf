# Include from the Cloud (apex) nginx server. Requires AppFlowy-Cloud on the
# same origin so login cookies reach auth_request.
#
#   include /opt/muse-dsh/nginx/cloud-same-origin-dsh.conf;
#
# Substitute:
#   POOL_PORT   loopback control+proxy (default 13079)
#   DSH_PORT    shared instance during P0 (default 3080)
#   MUSE_BFF    127.0.0.1:8010 (muse-dsh-bff; official Cloud 0.16.5 has no /api/muse)
#   CLOUD_UPSTREAM  127.0.0.1:8000 (AppFlowy-Cloud, unused for DSH auth_request)

location = /internal/muse-dsh-auth {
    internal;
    proxy_pass http://127.0.0.1:8010/api/muse/dsh/ingress-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Muse-Device-Token $http_x_muse_device_token;
}

# P0 shared instance. P1 switches this to the pool listen port.
location /dsh/ {
    auth_request /internal/muse-dsh-auth;
    proxy_pass http://127.0.0.1:3080/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3080;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
}

# P1 tenant instances. Proxy listen is pool control + 1 (default 13080).
# Host must stay the public authority: DSH Origin===Host trust fence 403s
# when nginx/pool rewrite Host to loopback while the browser Origin is the apex.
location /u/ {
    auth_request /internal/muse-dsh-auth;
    proxy_pass http://127.0.0.1:13080/u/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
}
