[workspace]
resolver = "2"
members = [
  "crates/openmuse-contract",
  "crates/openmuse-plugin-protocol",
  "crates/openmuse-platform-runtime",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
