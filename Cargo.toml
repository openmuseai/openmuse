[workspace]
resolver = "2"
members = [
  "crates/openmuse-contract",
  "crates/openmuse-cloud-resource-authority",
  "crates/openmuse-plugin-protocol",
  "crates/openmuse-platform-runtime",
  "crates/openmuse-storage-contract",
  "crates/openmuse-storage-credentials",
  "crates/openmuse-storage-s3",
  "crates/openmuse-storage-tck",
  "crates/openmuse-storage-portability",
  "crates/openmuse-storage-qualification",
  "crates/openmuse-workspace-sync",
  "crates/openmuse-workspace-sandbox",
  "crates/openmuse-cloud-execution-runtime",
  "crates/openmuse-draft-transaction",
  "crates/openmuse-cli-registry",
  "crates/openmuse-worker-supervisor",
  "crates/openmuse-sandbox-security",
  "crates/openmuse-paired-relay",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
async-trait = "0.1.89"
futures = "0.3.31"
tokio = { version = "1.47.1", features = ["fs", "io-util", "net", "rt", "sync"] }
url = "=2.5.4"
aws-sdk-s3 = { version = "=1.88.0", features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "=1.0.2", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = "=1.8.0"
tempfile = "3.23.0"
zeroize = "1.8.1"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
hkdf = "0.12.4"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
