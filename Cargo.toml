[workspace]
resolver = "2"
members = [
  "crates/openmuse-contract",
  "crates/openmuse-plugin-protocol",
  "crates/openmuse-platform-runtime",
  "crates/openmuse-storage-contract",
  "crates/openmuse-storage-tck",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
async-trait = "0.1.89"
futures = "0.3.31"
