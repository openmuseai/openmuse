name: openmuse_resource_lab
description: "Development-only resource framework acceptance Host."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  openmuse_dsh_plugin:
    path: ../../plugins/dsh-agent
  openmuse_resource_center_host:
    path: ../../packages/openmuse_resource_center_host
  openmuse_resource_notes:
    path: ../../plugins/resource-notes
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk
  openmuse_i18n:
    path: ../../packages/openmuse_i18n
  openmuse_workspace_paired:
    path: ../../plugins/workspace-paired
  muse_dsh_conversation_core:
    path: ../../packages/muse_dsh_conversation_core
  muse_dsh_conversation_flutter:
    path: ../../packages/muse_dsh_conversation_flutter
  muse_dsh_conversation_protocol:
    path: ../../packages/muse_dsh_conversation_protocol
  flutter:
    sdk: flutter

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
