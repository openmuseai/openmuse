name: openmuse_dsh_plugin
description: Optional DSH panel and sidecar runtime plugin for OpenMuse.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  path: ^1.9.1
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: OpenMuseDshWebViewPlugin
      windows:
        pluginClass: OpenmuseDshPluginCApi
