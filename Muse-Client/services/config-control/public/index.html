<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenMuse Config</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body>
  <aside><a class="brand" href="/">◈ <span>OpenMuse<small>CONFIG CONTROL</small></span></a><div class="nav-label" data-i18n="workspace"></div><nav><button data-view="overview" class="selected" data-i18n="overview"></button><button data-view="editor" data-i18n="configuration"></button><button data-view="messages" data-i18n="messages"></button><button data-view="releases" data-i18n="releases"></button><button data-view="audit" data-i18n="audit"></button></nav><div class="aside-bottom"><span class="status-dot"></span><span data-i18n="localService"></span><small id="origin"></small></div></aside>
  <main>
    <header><div><div class="eyebrow" data-i18n="platform"></div><h1 id="page-title"></h1></div><div class="controls"><select id="ui-locale" aria-label="Language"></select><select id="actor" hidden></select><input id="token" type="password" autocomplete="off" data-placeholder="token" hidden><button id="connect" data-i18n="connect" hidden></button><span class="avatar">OM</span></div></header>
    <div id="demo-banner" class="banner" hidden data-i18n="demoNotice"></div>
    <div id="notice" role="status" hidden></div>
    <section class="scope-bar"><label><span data-i18n="scope"></span><select id="scope"></select></label><span id="scope-description" class="muted"></span><button id="refresh" class="quiet" data-i18n="refresh"></button></section>
    <section id="overview" class="view"><div class="intro"><div><h2 data-i18n="overviewTitle"></h2><p data-i18n="overviewDescription"></p></div><button id="new-draft" class="primary" data-i18n="newDraft"></button></div><div class="metrics"><article><span data-i18n="activeSequence"></span><strong id="sequence">—</strong><small id="active-release"></small></article><article><span data-i18n="rollout"></span><strong id="rollout-value">—</strong><small data-i18n="publicCohorts"></small></article><article><span data-i18n="languages"></span><strong id="language-count">—</strong><small id="language-list"></small></article><article><span data-i18n="pendingChanges"></span><strong id="draft-count">—</strong><small data-i18n="independentReview"></small></article></div><div class="panel"><div class="panel-heading"><h3 data-i18n="recentDrafts"></h3><span class="chip" data-i18n="immutableRelease"></span></div><div id="draft-list"></div></div><div class="flow"><span data-i18n="editStep"></span><b>→</b><span data-i18n="validateStep"></span><b>→</b><span data-i18n="approveStep"></span><b>→</b><span data-i18n="publishStep"></span><b>→</b><span data-i18n="rolloutStep"></span></div></section>
    <section id="editor" class="view" hidden><div class="intro"><div><h2 data-i18n="editorTitle"></h2><p data-i18n="editorDescription"></p></div><span id="draft-state" class="chip"></span></div><div class="editor-layout"><div class="panel"><label class="field"><span data-i18n="changeNote"></span><input id="note" data-placeholder="changeNote"></label><div class="field-grid"><label class="field"><span data-i18n="defaultLocale"></span><select id="default-locale"></select></label><label class="field"><span data-i18n="updateChannel"></span><input id="channel"></label></div><fieldset id="runtime-settings" class="runtime-settings"><legend data-i18n="featureFlags"></legend><label><input type="checkbox" id="flag-market"><span data-i18n="pluginMarketEnabled"></span></label><label><input type="checkbox" id="flag-updates"><span data-i18n="updatePromptsEnabled"></span></label><label class="field"><span data-i18n="refreshIntervalSeconds"></span><input id="refresh-interval" type="number" min="60" max="1800" step="1" value="300"></label></fieldset><fieldset id="portal-settings" class="runtime-settings" hidden><legend data-i18n="portalTitle"></legend><p data-i18n="portalDescription"></p><div class="field-grid"><label class="field"><span data-i18n="portalRegion"></span><select id="portal-region"></select></label><label class="field"><span data-i18n="language"></span><select id="portal-locale"></select></label></div><label class="field"><span data-i18n="portalEntrypoints"></span><code id="portal-entrypoints"></code></label><div class="field-grid"><label class="field"><span data-i18n="portalSlot"></span><select id="portal-slot"></select></label><label class="field"><span data-i18n="portalKind"></span><input id="portal-kind" readonly></label></div><label class="field"><span data-i18n="portalMediaUrl"></span><input id="portal-media-url" type="url"></label><label class="field"><span data-i18n="portalPosterUrl"></span><input id="portal-poster-url" type="url"></label><div class="actions inline"><button id="portal-preview" type="button" data-i18n="portalPreview"></button><button id="portal-apply" type="button" data-i18n="portalApply"></button></div><div id="portal-media-preview"></div><label class="field"><span data-i18n="portalDownloads"></span><textarea id="portal-downloads" rows="7" spellcheck="false"></textarea></label><p data-i18n="portalDownloadsHelp"></p><button id="portal-downloads-apply" type="button" data-i18n="portalApply"></button></fieldset><label class="field"><span data-i18n="snapshotData"></span><textarea id="snapshot" spellcheck="false" rows="24"></textarea></label></div><div class="panel review"><h3 data-i18n="review"></h3><p data-i18n="reviewDescription"></p><pre id="diff"></pre><div id="approval-list"></div><div class="actions"><button id="validate" data-i18n="validate"></button><button id="save" class="primary" data-i18n="save"></button><button id="submit" data-i18n="submit"></button><button id="approve" data-i18n="approve"></button><button id="publish" class="primary" data-i18n="publish"></button></div><label class="field"><span data-i18n="lifetime"></span><input id="ttl" type="number" min="300" max="604800" value="86400"></label><small data-i18n="hashBound"></small><code id="draft-hash"></code></div></div></section>
    <section id="messages" class="view" hidden><div class="intro"><div><h2 data-i18n="messagesTitle"></h2><p data-i18n="messagesDescription"></p></div></div><div class="panel"><div class="field-grid"><label class="field"><span data-i18n="language"></span><select id="pack-locale"></select></label><label class="field"><span data-i18n="namespace"></span><select id="pack-namespace"></select></label></div><div class="actions inline"><button id="load-pack" data-i18n="loadTemplate"></button><button id="attach-pack" class="primary" data-i18n="attachPack"></button></div><label class="field"><span data-i18n="messageData"></span><textarea id="pack" spellcheck="false" rows="23"></textarea></label><div id="pack-list"></div></div></section>
    <section id="releases" class="view" hidden><div class="intro"><div><h2 data-i18n="releasesTitle"></h2><p data-i18n="releasesDescription"></p></div></div><div class="panel"><div class="rollout-controls"><label class="field"><span data-i18n="rollout"></span><select id="percent"><option value="0">0%</option><option value="1">1%</option><option value="5">5%</option><option value="25">25%</option><option value="100">100%</option></select></label><button id="apply-rollout" class="primary" data-i18n="applyRollout"></button></div><div id="release-list"></div></div><div class="panel"><h3 data-i18n="simulateTitle"></h3><div class="actions inline"><input id="cohort" type="number" min="0" max="99" value="0"><button id="simulate" data-i18n="simulate"></button></div><pre id="simulation"></pre></div></section>
    <section id="audit" class="view" hidden><div class="intro"><div><h2 data-i18n="auditTitle"></h2><p data-i18n="auditDescription"></p></div></div><div class="panel"><div id="audit-list"></div></div></section>
  </main>
</body></html>
