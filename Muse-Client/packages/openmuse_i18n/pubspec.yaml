name: openmuse_i18n
description: Shared runtime locale, typed messages, and validated language bundles.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  intl: ^0.20.2
  openmuse_runtime_config:
    path: ../openmuse_runtime_config
  openmuse_plugin_sdk:
    path: ../openmuse_plugin_sdk
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/
    - assets/brand/
