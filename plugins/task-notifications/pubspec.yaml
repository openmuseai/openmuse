name: openmuse_task_notifications
description: Opt-in, content-free local task notifications for OpenMuse Mobile.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  openmuse_i18n:
    path: ../../packages/openmuse_i18n
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: io.openmuse.task_notifications
        pluginClass: TaskNotificationsPlugin
      ios:
        pluginClass: TaskNotificationsPlugin
