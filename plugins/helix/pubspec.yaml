name: openmuse_helix_plugin
description: Hot-activatable Helix PTY editor plugin for OpenMuse.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_pty: ^0.4.2
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk
  path: ^1.9.1
  path_provider: ^2.1.5
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/engines/helix/
