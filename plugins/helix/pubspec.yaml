name: openmuse_helix_plugin
description: Hot-activatable Helix PTY editor plugin for OpenMuse.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_pty: ^0.4.2
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk
  path: ^1.9.1
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Listed file by file rather than as the directory `assets/engines/helix/`:
  # a directory entry is expanded with a non-recursive listing
  # (`_parseAssetsFromFolder` in flutter_tools), so a file two levels down is
  # dropped silently, and it cannot carry a `platforms` filter either.
  assets:
    - assets/engines/helix/config.toml
    - assets/engines/helix/LICENSE.MPL-2.0
    - assets/engines/helix/README.txt
    # OpenMuse-authored theme: source, not a staged engine artefact, so it ships
    # on every platform.
    - assets/engines/helix/runtime/themes/openmuse_dark.toml
    # The pinned engine is a macOS Universal binary, and scripts/package_macos.sh
    # asserts it lands next to these files inside the .app bundle. Windows looks
    # for `hx.exe`, so bundling it there would only add 56 MB of Mach-O to the
    # Windows package.
    - path: assets/engines/helix/hx
      platforms: [macos]
