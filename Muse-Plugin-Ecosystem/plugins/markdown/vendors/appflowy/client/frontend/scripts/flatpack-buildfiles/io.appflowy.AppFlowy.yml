app-id: com.openmuseai.dshoffice
runtime: org.freedesktop.Platform
runtime-version: '21.08'
sdk: org.freedesktop.Sdk
command: muse
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
modules:
  - name: dsh-office
    buildsystem: simple
    build-commands:
      # - ls .
      - cp -r dsh-office /app/muse
      - chmod +x /app/muse/muse
      - install -Dm644 logo.svg /app/share/icons/hicolor/scalable/apps/com.openmuseai.dshoffice.svg
      - mkdir /app/bin
      - ln -s /app/muse/muse /app/bin/muse
      - install -Dm644 com.openmuseai.dshoffice.desktop /app/share/applications/com.openmuseai.dshoffice.desktop
    sources:
      - type: archive
        url: https://github.com/openmuseai/muse-client/releases/download/0.0.2/dsh-office-linux-x86.tar.gz
        sha256: b0dbe669bb9f34a65171adecaf61b02578bab5214d18a54009f0e4ec10665711
        dest: dsh-office
      - type: file
        path: com.openmuseai.dshoffice.desktop
      - type: file
        path: logo.svg