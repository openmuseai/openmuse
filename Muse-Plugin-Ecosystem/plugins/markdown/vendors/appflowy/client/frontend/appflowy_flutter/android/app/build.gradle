def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 35
    // Use the same NDK as cargo-ndk when built through the Muse wrapper.
    if (System.getenv('ANDROID_NDK_HOME')) {
        ndkPath System.getenv('ANDROID_NDK_HOME')
        def ndkProperties = new Properties()
        file("${System.getenv('ANDROID_NDK_HOME')}/source.properties").withInputStream {
            ndkProperties.load(it)
        }
        // CargoKit plugins consume ndkVersion rather than ndkPath.
        ndkVersion ndkProperties.getProperty('Pkg.Revision')
    } else {
        ndkVersion "24.0.8215888"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += 'jniLibs/'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        // Explicit legacy updates keep the installed application's data sandbox.
        def museApplicationId = System.getenv('MUSE_ANDROID_APPLICATION_ID') ?: "com.openmuseai.dshoffice"
        if (!(museApplicationId ==~ /[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+/)) {
            throw new GradleException("Invalid MUSE_ANDROID_APPLICATION_ID")
        }
        applicationId museApplicationId
        minSdkVersion 29
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STL=c++_shared"
            }
        }
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }
    buildTypes {
        release {
            // use release instead when publishing the application to google play.
            // signingConfig signingConfigs.release
            signingConfig signingConfigs.debug
        }
    }

    namespace 'io.appflowy.appflowy'

    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
        }
    }

    // only support arm64-v8a
    defaultConfig {
        ndk {
            // Flutter configures ABI splits for --split-per-abi. AGP rejects
            // combining those splits with defaultConfig.ndk.abiFilters.
            if (project.findProperty('split-per-abi') != 'true') {
                abiFilters "arm64-v8a"
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.android.support:multidex:2.0.1"
}
