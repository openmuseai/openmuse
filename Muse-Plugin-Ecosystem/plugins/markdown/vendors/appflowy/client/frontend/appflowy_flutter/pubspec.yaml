dev_dependencies:
  # Introduce talker to log the bloc events, and only log the events in the development mode

  bloc_test: ^10.0.0
  build_runner: ^2.4.9
  envied_generator: ^1.0.1
  flutter_lints: ^5.0.0

  flutter_test:
    sdk: flutter
  freezed: ^2.4.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.1

  mocktail: ^1.0.1

  plugin_platform_interface: any
  run_with_network_images: ^0.0.1
  url_launcher_platform_interface: any
  webview_flutter_platform_interface: ^2.14.0

dependency_overrides:
  # Local macOS debug builds use Flutter 3.27.4 (Dart 3.6). Do not override
  # analyzer/intl/leak_tracker to the Flutter 3.44 pins here — those require
  # Dart >=3.7 and break `flutter pub get` on 3.27.4.
  word_render:
    path: ../../../../../vendors/ioffice/word/word_render
  # 0.4.2 duplicates the executable in the Windows command line (the child
  # receives its own path as the first argument) and builds it without quoting
  # or UTF-8 decoding; the vendored copy fixes all three. See the header comment
  # in vendors/flutter_pty/src/flutter_pty_win.c.
  flutter_pty:
    path: ../../../../../vendors/flutter_pty
  http: ^1.0.0
  device_info_plus: ^11.2.2
  flutter_math_fork: 0.7.3

  url_protocol:
    git:
      url: https://github.com/LucasXu0/flutter_url_protocol.git
      commit: 737681d

  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: "470c4e7"

  appflowy_editor_plugins:
    git:
      url: https://github.com/AppFlowy-IO/AppFlowy-plugins.git
      path: "packages/appflowy_editor_plugins"
      ref: "4efcff7"

  sheet:
    git:
      url: https://github.com/jamesblasco/modal_bottom_sheet
      ref: e44458d
      path: sheet

  window_manager:
    git:
      url: https://github.com/leanflutter/window_manager.git
      ref: "5a43aed"
      path: packages/window_manager

  uuid: ^4.4.0

  flutter_cache_manager:
    git:
      url: https://github.com/LucasXu0/flutter_cache_manager.git
      commit: fbab857b1b1d209240a146d32f496379b9f62276
      path: flutter_cache_manager

  flutter_sticky_header: ^0.7.0

  reorderable_tabbar:
    git:
      url: https://github.com/LucasXu0/reorderable_tabbar
      ref: 93c4977
  # Don't upgrade file_picker until the issue is fixed
  # https://github.com/miguelpruivo/flutter_file_picker/issues/1652
  file_picker: 8.1.4

  auto_updater:
    git:
      url: https://github.com/LucasXu0/auto_updater.git
      path: packages/auto_updater
      ref: 1d81a824f3633f1d0200ba51b78fe0f9ce429458

  auto_updater_macos:
