name: openmuse_smart_document_plugins
description: Native product composition of independent smart-document and dataset resource plugins.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
dependencies:
  http: 1.6.0
  flutter:
    sdk: flutter
  openmuse_mobile_core:
    path: ../../packages/openmuse_mobile_core
  openmuse_mobile_cloud:
    path: ../../packages/openmuse_mobile_cloud
  openmuse_cloud_workspace_plugin:
    path: ../../plugins/cloud-workspace
  openmuse_resource_center:
    path: ../../packages/openmuse_resource_center
  openmuse_smart_document:
    path: ../../../Muse-Plugin-Ecosystem/plugins/markdown/smart_document/flutter
  muse_appflowy_realtime:
    path: ../../packages/muse_appflowy_realtime
  crypto: ^3.0.6
  path_provider: ^2.1.5
  url_launcher: 6.3.3
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk
  openmuse_smart_document_plugin:
    path: ../../plugins/smart-document
  openmuse_dataset_plugin:
    path: ../../plugins/dataset
  openmuse_dataset:
    path: ../../../Muse-Plugin-Ecosystem/plugins/markdown/smart_document/dataset/flutter
  muse_content_store:
    path: ../../packages/muse_content_store

dev_dependencies:
  flutter_test:
    sdk: flutter
